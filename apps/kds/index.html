<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RCMS — Kitchen Display System (KDS)</title>
  <link rel="stylesheet" href="/kds/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* UNIFIED CROSS-APP NAVIGATION BAR */
    .unified-nav {
      background: #0f172a;
      border-bottom: 1px solid #334155;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .unified-nav .brand-title {
      font-weight: 900;
      font-size: 1.1rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .unified-nav .nav-tabs {
      display: flex;
      gap: 12px;
    }
    .unified-nav .nav-link {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #94a3b8;
      text-decoration: none;
      background: #1e293b;
      border: 1px solid #475569;
      transition: all 0.2s ease;
    }
    .unified-nav .nav-link:hover {
      color: #fff;
      border-color: #38bdf8;
    }
    .unified-nav .nav-link.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- UNIFIED CROSS-APP TOP NAVIGATION BAR -->
  <nav class="unified-nav">
    <div class="brand-title">
      <span>🍽️</span> RCMS RESTAURANT CHAIN SYSTEM
    </div>
    <div class="nav-tabs">
      <a href="/pos" class="nav-link">📱 POS Waiter PWA</a>
      <a href="/kds" class="nav-link active">📺 Kitchen Display (KDS)</a>
      <a href="/hq" class="nav-link">📊 HQ Command Center</a>
    </div>
  </nav>

  <!-- KDS HEADER BAR -->
  <header class="kds-header">
    <div class="kds-brand">
      <span class="fire-icon">🔥</span>
      <span class="kds-title">KITCHEN DISPLAY SYSTEM</span>
      <span class="station-badge" id="active-station-name">GRILL STATION</span>
    </div>

    <!-- STATION SELECTION BUTTONS -->
    <div class="station-selector">
      <button class="station-btn active" onclick="switchStation('GRILL')">🔥 GRILL</button>
      <button class="station-btn" onclick="switchStation('FRY')">🍟 FRY</button>
      <button class="station-btn" onclick="switchStation('COLD')">🥗 COLD</button>
      <button class="station-btn" onclick="switchStation('BAR')">🍹 BAR</button>
      <button class="station-btn" onclick="switchStation('ALL')">🌐 ALL STATIONS</button>
    </div>

    <div class="kds-clock">
      <span id="live-clock">15:42:00</span>
    </div>
  </header>

  <!-- KDS TICKET GRID -->
  <main class="kds-main">
    <div class="ticket-grid" id="kds-ticket-grid">
      <!-- Dynamic KDS Tickets Injected Here -->
    </div>
  </main>

  <script src="/kds/app.js"></script>
</body>
</html>
