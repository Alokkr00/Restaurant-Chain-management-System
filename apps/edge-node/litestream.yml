# RCMS Edge Node Litestream Configuration
# Continuous SQLite replication to AWS S3

dbs:
  - path: /var/lib/rcms/edge_store.db
    replicas:
      - type: s3
        bucket: rcms-edge-backups-prod
        path: outlet_flagship_01/edge_store.db
        endpoint: s3.ap-south-1.amazonaws.com
        sync-interval: 10s
        snapshot-interval: 1h
        retention: 72h
